name: CI

# Before this workflow existed, a pull request ran only dependency-review and the labeler:
# no tests, no typecheck, no lint. The Python suite existed but nothing outside a
# developer's own shell ever ran it, so several modules documented invariants as
# "mechanically enforced" that in practice were enforced by remembering to run pytest.
#
# Runs on windows-latest because that is the only platform Omnivert ships to, and the
# app makes Windows-specific assumptions (%LOCALAPPDATA% settings path, the frozen
# PyInstaller/Inno chain). Testing on the platform that is actually shipped is worth more
# here than the broader coverage a Linux runner would add.

on:
  push:
    branches: ["main"]
  # Deliberately NOT filtered by base branch. A `branches:` filter here matches the branch a
  # pull request TARGETS, so filtering to main silently skipped every stacked pull request,
  # which is precisely the shape a change too large for one review arrives in. Found the hard
  # way: the follow-up security pull request opened green with no checks having run at all.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.12 is what the release chain uses.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Import checks
        run: python -m compileall -q src

      - name: Unit tests
        run: python -m pytest -q

      - name: Engine conversion smoke tests
        # The same gate the automated engine bump relies on. Kept as a separate step so a
        # failure here reads as "the engine broke" rather than "a unit test broke".
        run: python tests/engine_smoke.py

  frontend:
    name: Frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Typecheck and build
        run: npm run build --prefix frontend

      - name: Lint
        run: npm run lint --prefix frontend
