[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivert"
dynamic = ["version"]
description = "A Windows desktop GUI for Omnivert document conversion."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "BrandonDry" }]
keywords = [
  "markdown",
  "converter",
  "document-conversion",
  "markitdown",
  "pdf",
  "docx",
  "pptx",
  "xlsx",
  "desktop",
  "gui",
  "llm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
]
dependencies = [
  # >=0.132 for the strict_content_type default: below it a request body with NO
  # Content-Type is parsed as JSON, and a browser can send that cross-origin without a CORS
  # preflight, which makes every JSON route a CSRF target. The requirement was previously
  # unbounded, so an environment already holding an older FastAPI stayed vulnerable.
  "fastapi>=0.132",
  "uvicorn[standard]",
  "python-multipart",
  "trio",
  "pywebview",
  "markitdown[pptx,docx,xlsx,xls,pdf,outlook,az-doc-intel,az-content-understanding,audio-transcription]==0.1.7",
  # Image captioning builds an OpenAI-compatible client pointed at Anthropic (claude_shim.py).
  # This is OUR direct dependency: markitdown 0.1.7 does not pull openai in under any extra
  # (not even [all]). It only calls `client.chat.completions.create` on a client we hand it.
  # Without this line a clean install has a "Describe images with Claude" toggle that can
  # never succeed.
  #
  # Bounded to one major, matching how the engine itself is pinned: releases resolve
  # dependencies at build time, so an unbounded requirement lets two builds of the same tag
  # bundle different majors, and a major that changes the chat-completions request shape
  # would break captioning with no source change to point at. Verified against 3.11.0.
  "openai>=3,<4",
]

[project.optional-dependencies]
build = [
  "build",
  "pyinstaller",
]
test = [
  "pytest",
]

[project.urls]
Homepage = "https://github.com/BrandonDry/Omnivert"
Repository = "https://github.com/BrandonDry/Omnivert"
Issues = "https://github.com/BrandonDry/Omnivert/issues"
Changelog = "https://github.com/BrandonDry/Omnivert/blob/main/CHANGELOG.md"

[project.scripts]
omnivert = "omnivert.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package lives under src/, so pytest needs it importable without a PYTHONPATH dance.
# engine_smoke.py is deliberately NOT collected (it has no test_ prefix): CI runs it
# directly as the auto-bump gate, and it needs the real engine rather than a unit harness.
pythonpath = ["src"]

[tool.setuptools.dynamic]
version = {attr = "omnivert.app_version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omnivert = ["web/**"]
